name: SDK Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK and test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: sdk/python

      - name: Run SDK tests
        run: python -m pytest -q
        working-directory: sdk/python
