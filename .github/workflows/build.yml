name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-packer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python build_exe.py
        env:
          CI_VERSION_TAG: ${{ github.ref_name }}

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DGHubPluginPacker-${{ github.ref_name }}
          path: DGHubPluginPacker.exe

  build-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install -r requirements.txt
        working-directory: sdk/python

      - name: Build SDK package
        run: |
          python build_sdk.py
        env:
          CI_VERSION_TAG: ${{ github.ref_name }}
        working-directory: sdk/python

      - name: Upload SDK wheel
        uses: actions/upload-artifact@v4
        with:
          name: dghub-sdk-${{ github.ref_name }}
          path: sdk/python/dist/*
